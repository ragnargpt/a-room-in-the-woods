<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#294a40"><meta name="description" content="Bring your real room into a virtual world, one conversation at a time."><title>Room2World</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='20' fill='%23294a40'/%3E%3Cpath d='M18 39L40 18L62 39V63H18Z' stroke='%23f4ecd8' fill='none' stroke-width='4'/%3E%3Cpath d='M34 63V44H47V63' stroke='%23f4ecd8' fill='none' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<header><a class="brand" href="./"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 20L20 7L34 20V34H6Z M16 34V23H25V34"/></svg><span data-t="brand">Room2World</span></a><nav><button id="my-room" data-t="studio">My room</button><button id="example" data-t="demo">Explore an example</button><button id="language" class="quiet" data-t="language">中文</button></nav></header>
<main id="welcome">
<section class="hero"><div class="hero-text"><p class="eyebrow">A SMALL PLACE / A WORLD OF YOUR OWN</p><h1 data-t="intro"></h1><p class="lead" data-t="introBody"></p><div class="actions"><button id="begin" class="primary" data-t="start"></button><a id="guide-link" class="text-link" href="../" target="_blank" rel="noopener" data-t="read"></a></div><p class="privacy" data-t="private"></p></div><div class="hero-art" aria-label="An illustrated woodland and a little cabin"><div class="sun"></div><div class="ridge back"></div><div class="ridge front"></div><i class="pine p1"></i><i class="pine p2"></i><i class="pine p3"></i><i class="pine p4"></i><div class="cabin"><span></span><span></span><span></span><b></b></div><div class="path"></div><p>A room.<br>A view.<br>A little quiet.</p></div></section>
<section id="steps" class="steps"><article><p class="eyebrow" data-t="one"></p><h2 data-t="step1"></h2><div class="photo-plan" aria-hidden="true"><span>↑</span><span>←</span><b>＋</b><span>→</span><span>↓</span></div><p data-t="step1Body"></p></article><article><p class="eyebrow" data-t="two"></p><h2 data-t="step2"></h2><div class="measure" aria-hidden="true"><span>↔</span><b>W × D × H</b></div><p data-t="step2Body"></p></article><article><p class="eyebrow" data-t="three"></p><h2 data-t="step3"></h2><div class="conversation" aria-hidden="true"><span>“ My room… ”</span><span>“ Let’s begin. ”</span></div><p data-t="step3Body"></p></article></section>
<section class="copy-card"><div><p class="eyebrow">ONE MESSAGE TO BEGIN</p><h2 data-t="next"></h2><p id="start-prompt"></p></div><button id="copy" class="primary" data-t="copy"></button></section>
</main>
<main id="workspace" hidden><section id="viewport" aria-label="Interactive 3D woodland"><div id="canvas"></div><div class="scene-label"><p class="eyebrow">YOUR OWN LITTLE WORLD</p><h1 id="scene-title"></h1><p id="demo-note" data-t="demoNote"></p></div><div id="loading" role="status" data-t="loading" hidden></div><div class="camera-tools"><button data-view="room" data-t="roomView"></button><button data-view="camp" data-t="campView"></button><button data-view="lake" data-t="lakeView"></button><button data-view="overview" data-t="overview"></button></div><p class="control-hint" data-t="controls"></p></section><aside>
<div id="preview-note" class="notice" data-t="offline" hidden></div><section class="panel"><p class="eyebrow" data-t="progress"></p><ol id="journey"></ol><p id="next-step"></p><button id="refresh" data-t="refresh"></button></section>
<section class="panel"><h2 data-t="light"></h2><label for="city" data-t="location"></label><select id="city"></select><form id="custom-location" hidden><label><span data-t="city"></span><input id="place-name" maxlength="80" required></label><div class="pair"><label><span data-t="lat"></span><input id="latitude" type="number" min="-90" max="90" step="any" required></label><label><span data-t="lon"></span><input id="longitude" type="number" min="-180" max="180" step="any" required></label></div><label><span data-t="zone"></span><input id="timezone" required></label><button class="primary" data-t="apply"></button></form><p class="small" data-t="locationHelp"></p><div class="clock"><strong id="clock">12:00</strong><span id="phase"></span></div><label class="toggle"><input id="follow" type="checkbox" checked><span data-t="follow"></span></label><div class="pair"><label><span data-t="date"></span><input id="date" type="date"></label><label><span data-t="time"></span><input id="time" type="time" value="12:00"></label></div><div class="moments"><button data-hour="7" data-t="dawn"></button><button data-hour="12" data-t="day"></button><button data-hour="sunset" data-t="sunset"></button><button data-hour="22" data-t="night"></button></div><p id="events" class="small"></p></section>
<section class="panel"><h2 data-t="objects"></h2><div id="object-list"></div><details><summary data-t="library"></summary><div id="library-list"></div><p class="small" data-t="newObject"></p></details></section>
<section class="panel"><label class="toggle"><input id="forest" type="checkbox"><span data-t="forest"></span></label><p class="small" data-t="forestHelp"></p><label class="toggle"><input id="motion" type="checkbox" checked><span data-t="motion"></span></label><label class="toggle"><input id="sound" type="checkbox"><span data-t="sound"></span></label><p class="small" data-t="soundHint"></p><label class="toggle"><input id="fire" type="checkbox"><span data-t="fire"></span></label><label class="toggle"><input id="quality" type="checkbox"><span data-t="quality"></span></label><p class="small" data-t="qualityHint"></p></section>
<section class="panel"><button id="save" class="primary" data-t="save"></button><p class="small" data-t="snapHint"></p><details id="version-panel"><summary data-t="versions"></summary><div id="version-list"></div></details></section>
</aside></main><div id="toast" role="status" hidden></div><dialog id="error-dialog"><h2 data-t="error"></h2><p id="error-text"></p><button id="dismiss" data-t="dismiss"></button></dialog><footer><span data-t="tagline"></span><a id="source-link" href="https://github.com/" target="_blank" rel="noopener">GitHub ↗</a></footer><script type="module" src="app.js"></script></body></html>
